services:
  - type: web
    name: taskpilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run preflight
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskpilot-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_REJECT_UNAUTHORIZED
        value: "false"

databases:
  - name: taskpilot-db
    plan: free
    databaseName: taskpilot
