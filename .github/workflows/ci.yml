name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npm test
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskpilot_test